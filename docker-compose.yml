services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: growearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growearn_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-growearn}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growearn} -d ${POSTGRES_DB:-growearn}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - growearn-internal
    profiles: ["default", "infra", "all"]

  embedding-service:
    image: ollama/ollama:0.5.4
    container_name: growearn-embedding-service
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-11434}:11434"
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - growearn-internal
    profiles: ["default", "infra", "all"]

  model-init:
    image: ollama/ollama:0.5.4
    container_name: growearn-model-init
    depends_on:
      embedding-service:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking and pre-loading BGE-M3 embedding model..."
        ollama pull $${BGE_M3_MODEL:-bge-m3}
        echo "BGE-M3 model ready for production RAG inference."
    environment:
      - OLLAMA_HOST=http://embedding-service:11434
      - BGE_M3_MODEL=${BGE_M3_MODEL:-bge-m3}
    networks:
      - growearn-internal
    restart: "no"
    profiles: ["default", "infra", "all"]

  # One-shot database migration service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: growearn-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-growearn}:${POSTGRES_PASSWORD:-growearn_secure_password}@postgres:5432/${POSTGRES_DB:-growearn}?schema=public
    networks:
      - growearn-internal
    profiles: ["default", "all"]

  # CrewAI Multi-Agent Service (Researcher, Planner, Reviewer)
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: growearn-agents
    restart: unless-stopped
    depends_on:
      embedding-service:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - EMBEDDING_BASE_URL=http://embedding-service:11434
      - GROWEARN_API_BASE=http://app:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - growearn-internal
    profiles: ["default", "all"]

  # Next.js 16 Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growearn-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embedding-service:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
      agents:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-growearn}:${POSTGRES_PASSWORD:-growearn_secure_password}@postgres:5432/${POSTGRES_DB:-growearn}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_BASE_URL=http://embedding-service:11434
      - BGE_M3_MODEL=${BGE_M3_MODEL:-bge-m3}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AGENTS_SERVICE_URL=http://agents:8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - HNSW_EF_SEARCH=${HNSW_EF_SEARCH:-64}
      - CASHFREE_CLIENT_ID=${CASHFREE_CLIENT_ID}
      - CASHFREE_CLIENT_SECRET=${CASHFREE_CLIENT_SECRET}
      - CASHFREE_ENVIRONMENT=${CASHFREE_ENVIRONMENT:-sandbox}
      - CASHFREE_API_VERSION=${CASHFREE_API_VERSION:-2023-08-01}
      - PLATFORM_COMMISSION_PERCENT=${PLATFORM_COMMISSION_PERCENT:-10}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - APP_ENV=${APP_ENV:-production}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - growearn-internal
    profiles: ["default", "all"]

networks:
  growearn-internal:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
