name: Continuous Integration & Verification (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: groearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/groearn_test?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/groearn_test?sslmode=disable"
      JWT_SECRET: "ci-test-jwt-secret-key-2026-production-testing-random"
      JWT_EXPIRES_IN: "7d"
      MOCK_AI: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STORAGE_PROVIDER: "local"
      ALLOW_PRODUCTION_SEED: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Wait for PostgreSQL Service
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d groearn_test; then
              echo "PostgreSQL pgvector is ready!"
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
          done

      - name: 1. Clean Dependency Installation
        run: npm ci

      - name: 2. Generate Prisma Client
        run: npx prisma generate

      - name: 3. Synchronize Database Schema
        run: npx prisma db push --skip-generate

      - name: 4. Seed Database for Testing
        run: npx tsx prisma/seed.ts
        env:
          ALLOW_PRODUCTION_SEED: "true"

      - name: 5. Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 6. Run ESLint Rules Check
        run: npm run lint

      - name: 7. Run Master End-to-End Test Suite
        run: npm test

      - name: 8. Build Next.js Production Bundle
        run: npm run build
