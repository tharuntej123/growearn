name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Lint & TypeCheck
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"
      JWT_SECRET: "ci-test-jwt-secret-key-2026"
      MOCK_AI: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GROQ_API_KEY: "mock-groq-key"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit --prefer-offline

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build
