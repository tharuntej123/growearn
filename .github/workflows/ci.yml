name: Continuous Integration & Verification (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/groearn_test?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/groearn_test?sslmode=disable"
      JWT_SECRET: "ci-test-jwt-secret-key-2026-production-testing-random"
      JWT_EXPIRES_IN: "7d"
      MOCK_AI: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STORAGE_PROVIDER: "local"
      ALLOW_PRODUCTION_SEED: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 1. Start PostgreSQL with pgvector
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgrespassword \
            -e POSTGRES_DB=groearn_test \
            -p 5432:5432 \
            pgvector/pgvector:pg16

          echo "Waiting for PostgreSQL service to be ready..."
          until docker exec postgres pg_isready -U postgres -d groearn_test; do
            echo "Waiting..."
            sleep 1
          done
          echo "PostgreSQL is ready and healthy!"

      - name: 2. Install Dependencies
        run: npm ci

      - name: 3. Generate Prisma Client
        run: npx prisma generate

      - name: 4. Push Database Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: 5. Seed Test Database
        run: npx tsx prisma/seed.ts
        env:
          ALLOW_PRODUCTION_SEED: "true"

      - name: 6. Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 7. Run ESLint Rules Check
        run: npm run lint

      - name: 8. Run Master Test Suite
        run: npm test

      - name: 9. Build Next.js Production Bundle
        run: npm run build
