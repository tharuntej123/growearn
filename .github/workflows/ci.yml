name: Continuous Integration & Verification (CI)

on:
  push:
    branches: [main, master, develop, hardening/production]
  pull_request:
    branches: [main, master, hardening/production]

jobs:
  validate-and-build:
    name: Full CI Pipeline (Typecheck, Lint, Test, RAG, E2E & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: growearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growearn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgrespassword"
      POSTGRES_DB: "growearn_test"
      DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable"
      AUTH_SECRET: "ci-test-auth-secret-key-minimum-32-chars-long-secure-random"
      AUTH_URL: "http://127.0.0.1:3000"
      GOOGLE_CLIENT_ID: "mock-ci-google-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "mock-ci-google-client-secret"
      INTERNAL_SERVICE_KEY: "ci-internal-service-key-minimum-32-characters-long"
      APP_ENV: "test"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
      STORAGE_PROVIDER: "local"
      CASHFREE_ENVIRONMENT: "sandbox"
      CASHFREE_CLIENT_ID: "test_cashfree_client_id_for_verification"
      CASHFREE_CLIENT_SECRET: "test_secret_for_cryptographic_verification_key"
      CASHFREE_API_VERSION: "2023-08-01"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agents/requirements.txt'

      - name: 1. Clean Dependency Installation
        run: |
          npm ci --legacy-peer-deps || npm install --no-audit --prefer-offline
          cd agents && pip install -r requirements.txt && cd ..

      - name: 2. Verify PostgreSQL & pgvector Readiness
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d growearn_test; then
              echo "PostgreSQL service is ready and accepting connections!"
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
          done
          psql "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable" -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';"

      - name: 3. Generate Prisma Client
        run: npx prisma generate

      - name: 4. Deploy Prisma Database Migrations
        run: npx prisma migrate deploy

      - name: 5. Seed Database for Testing
        run: npx tsx prisma/seed.ts
        env:
          APP_ENV: "test"

      - name: 6. Run Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 7. Run ESLint Rules Check
        run: npm run lint

      - name: 8. Run Master Integration & Security Test Suite
        run: npm test

      - name: 9. Run CrewAI Multi-Agent Python Tests
        run: |
          cd agents
          pytest tests/ -v
          cd ..

      - name: 10. Run Extended Agentic, LangChain, Hybrid & Rate-Limit Tests
        run: |
          npm run test:agentic
          npm run test:langchain
          npm run test:hybrid
          npm run test:rate-limit

      - name: 11. Run Production RAG Pipeline & Intent Classifier Verification
        run: npm run test:rag

      - name: 12. Build Docker Images (Validate Dockerfile & Compose Syntax)
        run: docker compose build

      - name: 13. Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: "production"

      - name: 14. Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: 15. Run Playwright End-to-End Browser Tests
        run: npx playwright test --reporter=list,github
        env:
          CI: "true"
          NODE_ENV: "production"
          APP_ENV: "test"
          DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable"
          DIRECT_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/growearn_test?sslmode=disable"
          AUTH_SECRET: "ci-test-auth-secret-key-minimum-32-chars-long-secure-random"
          AUTH_URL: "http://127.0.0.1:3000"
          GOOGLE_CLIENT_ID: "mock-ci-google-client-id.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "mock-ci-google-client-secret"
          INTERNAL_SERVICE_KEY: "ci-internal-service-key-minimum-32-characters-long"
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

      - name: Upload Playwright Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
